name: Tag and Release on Merge

on:
  push:
    branches:
      - main # Triggered when a PR is merged or a commit is pushed to main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for the tag action to see existing tags

      - name: Bump version
        id: tag_action
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.tag_action.outputs.new_tag }}
          gh release create $VERSION \
            --title "Release $VERSION" \
            --notes "Automated release triggered by merge to main. Version $VERSION incremented automatically."
