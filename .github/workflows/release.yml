name: Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to create (e.g. 0.0.3)'
        required: true
        default: '0.0.3'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the version provided in the workflow input
          VERSION=${{ github.event.inputs.version }}
          echo "Creating release for version: $VERSION"
          
          gh release create $VERSION \
            --title "Release $VERSION" \
            --notes "Manual release version $VERSION"
